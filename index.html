<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#0f1115" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="DDP" />
<meta name="format-detection" content="telephone=no" />
<title>EXW → DDP</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🤖</text></svg>" />
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        -webkit-tap-highlight-color: transparent;
    }
    :root { color-scheme: dark; }
    html { -webkit-text-size-adjust: 100%; }
    body {
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: #0f1115;
        overscroll-behavior: none;
        padding: calc(16px + env(safe-area-inset-top))
                 calc(16px + env(safe-area-inset-right))
                 calc(16px + env(safe-area-inset-bottom))
                 calc(16px + env(safe-area-inset-left));
    }
    .calc {
        background: #1a1d24;
        border-radius: 16px;
        padding: 24px 22px;
        width: 100%;
        max-width: 480px;
        margin: auto;
        box-shadow: 0 8px 32px rgba(0, 0, 0, .55);
        touch-action: manipulation;
    }
    /* ===== 头部 ===== */
    .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 18px;
        gap: 10px;
        flex-wrap: wrap;
    }
    .header-left {
        display: flex;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
        flex: 1;
        min-width: 0;
    }
    h1 {
        color: #e8e8e8;
        font-size: 18px;
        letter-spacing: 0.5px;
        white-space: nowrap;
    }
    .mode-group {
        display: flex;
        gap: 4px;
        background: #242830;
        border-radius: 20px;
        padding: 3px;
        flex-shrink: 0;
    }
    .mode-btn {
        background: transparent;
        border: none;
        border-radius: 18px;
        padding: 6px 14px;
        font-size: 13px;
        font-weight: 600;
        color: #9aa0a6;
        cursor: pointer;
        transition: all .25s;
        white-space: nowrap;
        -webkit-appearance: none;
        appearance: none;
    }
    .mode-btn.active {
        background: #2a2e38;
        color: #e8e8e8;
        box-shadow: 0 2px 8px rgba(0, 0, 0, .3);
    }
    .mode-btn:hover:not(.active) { color: #c8d0dc; }
    .header-actions {
        display: flex;
        gap: 6px;
        flex-shrink: 0;
    }
    .lang-btn,
    .clear-btn {
        background: #2a2e38;
        border: 1px solid #3f4552;
        border-radius: 20px;
        color: #c8d0dc;
        font-size: 13px;
        font-weight: 600;
        padding: 8px 18px;
        cursor: pointer;
        transition: all .25s;
        white-space: nowrap;
        -webkit-appearance: none;
        appearance: none;
    }
    .lang-btn:hover,
    .clear-btn:hover {
        background: #353b48;
        border-color: #5b8def;
        color: #fff;
    }
    .clear-btn {
        border-color: #5f3a3a;
        color: #e8a0a0;
    }
    .clear-btn:hover {
        border-color: #e06060;
        color: #ffb0b0;
    }
    /* ===== 输入网格 ===== */
    .grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px 14px;
        margin-top: 6px;
    }
    .field {
        display: flex;
        flex-direction: column;
    }
    .field label {
        color: #9aa0a6;
        font-size: 12px;
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 2px 4px;
        margin-bottom: 4px;
    }
    .field label a {
        color: #5b8def;
        text-decoration: none;
        font-size: 14px;
        line-height: 1;
        margin-left: 2px;
    }
    .field label a:hover { text-decoration: underline; }
    .field input {
        width: 100%;
        background: #242830;
        border: 1px solid #333;
        border-radius: 8px;
        padding: 11px 12px;
        color: #fff;
        font-size: 16px;          /* iOS 关键：不能小于 16px */
        outline: none;
        -webkit-appearance: none;
        appearance: none;
        transition: border .2s, box-shadow .2s;
    }
    .field input:focus {
        border-color: #5b8def;
        box-shadow: 0 0 0 2px rgba(91, 141, 239, .15);
    }
    .field.hidden { display: none; }
    /* ===== 汇率状态提示 ===== */
    .rate-hint {
        display: block;
        font-size: 10px;
        line-height: 1.4;
        color: #6a7a88;
        margin-top: 3px;
        min-height: 14px;
        cursor: pointer;
        user-select: none;
        -webkit-user-select: none;
        transition: color .2s;
    }
    .rate-hint:hover { color: #9aa0a6; }
    .rate-hint.ok { color: #4ade80; }
    .rate-hint.err { color: #e8a0a0; }
    /* ===== 重货/抛货标识 ===== */
    .badge-wrap {
        text-align: center;
        min-height: 32px;
        margin-top: 8px;
    }
    .type-badge {
        display: inline-block;
        padding: 4px 14px;
        border-radius: 20px;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.3px;
    }
    .light { background: #3a2a1a; color: #ffb347; }
    .heavy { background: #1a2a3a; color: #5b9dff; }
    /* ===== 结果 ===== */
    .result {
        background: #242830;
        border-radius: 10px;
        padding: 18px 16px 14px;
        margin-top: 14px;
        text-align: center;
    }
    .result .result-label {
        color: #9aa0a6;
        font-size: 13px;
        display: block;
        margin-bottom: 2px;
    }
    .result .ddp-price {
        color: #4ade80;
        font-size: 30px;
        font-weight: 700;
        display: block;
        letter-spacing: 0.5px;
        line-height: 1.3;
        cursor: pointer;
        font-variant-numeric: tabular-nums;
        user-select: none;
        -webkit-user-select: none;
    }
    .result .ddp-price:active { opacity: .7; }
    .result .ddp-price.ddp-placeholder {
        color: #5a6a7a;
        font-weight: 400;
        font-size: 22px;
        cursor: default;
    }
    /* ===== 费用明细 ===== */
    .detail-row {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 2px 12px;
        margin-top: 10px;
        padding-top: 10px;
        border-top: 1px solid #2a2e38;
        font-size: 11px;
        color: #8a9aa8;
    }
    .detail-row .d-item { white-space: nowrap; }
    .detail-row .d-item .d-label { color: #6a7a88; }
    .detail-row .d-item .d-value {
        color: #c8d8e8;
        font-weight: 500;
        font-variant-numeric: tabular-nums;
    }
    .detail-row.hidden { display: none; }
    /* ===== 底部说明 ===== */
    .note {
        color: #5a6a7a;
        font-size: 11px;
        text-align: center;
        margin-top: 14px;
        line-height: 1.5;
    }
    /* ===== Toast ===== */
    .toast {
        position: fixed;
        left: 50%;
        bottom: calc(28px + env(safe-area-inset-bottom));
        transform: translateX(-50%) translateY(16px);
        background: #2a2e38;
        color: #e8e8e8;
        border: 1px solid #3f4552;
        padding: 9px 20px;
        border-radius: 20px;
        font-size: 13px;
        opacity: 0;
        pointer-events: none;
        transition: opacity .2s, transform .2s;
        z-index: 999;
        white-space: nowrap;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* ================================================================
       ⭐ 专注模式：点击 DDP 价格 → 隐藏全部，只显示完税后交货价
       ================================================================ */
    body.focus-mode {
        padding: 0;
        background: #0f1115;
        cursor: pointer;
    }
    body.focus-mode .calc {
        background: transparent;
        box-shadow: none;
        border-radius: 0;
        padding: 0;
        max-width: none;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    /* 隐藏计算器里除"结果"以外的所有区块 */
    body.focus-mode .calc > *:not(.result) {
        display: none !important;
    }
    body.focus-mode .result {
        background: transparent;
        padding: 0;
        margin: 0;
        width: 100%;
    }
    /* 结果里只保留价格本身 */
    body.focus-mode .result > *:not(.ddp-price) {
        display: none !important;
    }
    body.focus-mode .result .ddp-price {
        font-size: clamp(40px, 13vw, 130px);
        line-height: 1.15;
        letter-spacing: 1px;
        padding: 16px 10px;
        word-break: break-word;
        cursor: pointer;
        animation: pricePop .28s ease;
    }
    @keyframes pricePop {
        from { opacity: .35; transform: scale(.94); }
        to   { opacity: 1;   transform: scale(1); }
    }
    /* 退出提示：出现后自动淡出 */
    .focus-hint {
        position: fixed;
        left: 50%;
        bottom: calc(30px + env(safe-area-inset-bottom));
        transform: translateX(-50%);
        color: #4a5560;
        font-size: 12px;
        letter-spacing: .5px;
        opacity: 0;
        pointer-events: none;
        white-space: nowrap;
        z-index: 998;
    }
    body.focus-mode .focus-hint {
        animation: hintFade 3.2s ease forwards;
    }
    @keyframes hintFade {
        0%   { opacity: 0; }
        12%  { opacity: 1; }
        65%  { opacity: 1; }
        100% { opacity: 0; }
    }

    /* ===== 响应式 ===== */
    @media (max-width: 500px) {
        .calc { padding: 18px 14px; }
        .grid { gap: 10px; }
        .header-left { gap: 8px; }
        h1 { font-size: 16px; }
        .mode-btn { font-size: 12px; padding: 6px 10px; }
        .result .ddp-price { font-size: 26px; }
        .detail-row { font-size: 10px; gap: 2px 8px; }
        .field input { padding: 10px; font-size: 16px; }
        .header-actions { gap: 4px; }
        .lang-btn, .clear-btn { font-size: 12px; padding: 7px 12px; }
    }
    @media (max-width: 400px) {
        .grid { grid-template-columns: 1fr; }
        .header { flex-direction: column; align-items: stretch; }
        .header-left { flex-wrap: wrap; justify-content: center; }
        .header-actions { align-self: flex-end; }
    }
</style>
</head>
<body>
    <div class="calc">
        <div class="header">
            <div class="header-left">
                <h1 id="pageTitle">EXW → DDP</h1>
                <div class="mode-group">
                    <button class="mode-btn active" id="modeTrade">智能贸易</button>

            </div>
            <div class="header-actions">
                <button class="clear-btn" id="clearBtn">🗑️</button>

            </div>
        </div>

        <div class="grid">
            <div class="field">
                <label id="lblExw">结算价 EXW (¥)</label>
                <input id="exw" type="text" inputmode="decimal" autocomplete="off" placeholder="例: 100" />
            </div>
            <div class="field" id="fieldRate">
                <label id="lblRate">莫斯科央行汇率 (¥→₽)</label>
                <input id="rate" type="text" inputmode="decimal" autocomplete="off" placeholder="例: 12" />

            </div>
            <div class="field">
                <label id="lblWeight">毛重 /件 (kg)</label>
                <input id="weight" type="text" inputmode="decimal" autocomplete="off" placeholder="例: 2.5" />
            </div>
            <div class="field">
                <label id="lblVolume">体积 /件 (m³)</label>
                <input id="volume" type="text" inputmode="decimal" autocomplete="off" placeholder="例: 0.01" />
            </div>
            <div class="field" id="fieldQty">
                <label id="lblQty">箱内数量</label>
                <input id="qty" type="text" inputmode="numeric" autocomplete="off" placeholder="例: 10" />
            </div>
            <div class="field" id="fieldExpFee">
                <label id="lblExpFee">出口代理费率 (%)</label>
                <input id="expFee" type="text" inputmode="decimal" autocomplete="off" placeholder="例: 3" />
            </div>
            <div class="field">
                <label id="lblImpFee">进口代理费率 (%)</label>
                <input id="impFee" type="text" inputmode="decimal" autocomplete="off" placeholder="例: 10" />
            </div>
            <div class="field">
                <label id="lblTariff">关税税率 (%) <a href="https://www.alta.ru/tnved/" target="_blank" title="海关税则智能体查询">🐟</a></label>
                <input id="tariff" type="text" inputmode="decimal" autocomplete="off" placeholder="例: 10" />
            </div>
            <div class="field" id="fieldCertFee">
                <label id="lblCertFee">单证费用 (¥)</label>
                <input id="certFee" type="text" inputmode="decimal" autocomplete="off" placeholder="例: 1000" />
            </div>
            <div class="field">
                <label id="lblVat">增值税率 (%)</label>
                <input id="vat" type="text" inputmode="decimal" autocomplete="off" value="22" />
            </div>
        </div>

        <div class="badge-wrap" id="badgeWrap"></div>

        <div class="result">
            <span class="result-label" id="resultLabel">DDP 完税后交货价</span>
            <span class="ddp-price ddp-placeholder" id="ddpDisplay">—</span>
            <div class="detail-row" id="detailRow">
                <span class="d-item"><span class="d-label" id="dlFreight">运费</span> <span class="d-value" id="dvFreight">—</span></span>
                <span class="d-item"><span class="d-label" id="dlTariffAmt">关税</span> <span class="d-value" id="dvTariff">—</span></span>
                <span class="d-item"><span class="d-label" id="dlCustoms">海关杂费</span> <span class="d-value" id="dvCustoms">—</span></span>
                <span class="d-item"><span class="d-label" id="dlService">服务费</span> <span class="d-value" id="dvService">—</span></span>
                <span class="d-item"><span class="d-label" id="dlInsurance">保险费</span> <span class="d-value" id="dvInsurance">—</span></span>
                <span class="d-item"><span class="d-label" id="dlCertFee">单证费</span> <span class="d-value" id="dvCertFee">—</span></span>
                <span class="d-item"><span class="d-label" id="dlVatAmt">增值税</span> <span class="d-value" id="dvVat">—</span></span>
            </div>
        </div>

        <div class="note" id="noteText">毛重/体积为单个产品数值 · 通过AI查询俄海关代码后通过🐟️查询关税税率 · 一键清空🗑️ · 当日汇率可通过💰查询 · 智能交付DDP价格是到莫斯科</div>
    </div>

    <!-- 专注模式下的退出提示（自动淡出） -->
    <div class="focus-hint" id="focusHint"></div>

    //  语言
    // ================================================================
    const LOCALES = {

        dlCertFee: $('dlCertFee'), dlVatAmt: $('dlVatAmt'),
        exw: $('exw'), rate: $('rate'), weight: $('weight'), volume: $('volume'),
        qty: $('qty'), expFee: $('expFee'), impFee: $('impFee'), tariff: $('tariff'),
        certFee: $('certFee'), vat: $('vat'),
        fieldRate: $('fieldRate'), fieldExpFee: $('fieldExpFee'),
        fieldCertFee: $('fieldCertFee'), fieldQty: $('fieldQty'),
        rateHint: $('rateHint'), focusHint: $('focusHint')
    };

    // ================================================================
    //  数值读取（兼容逗号小数点，俄语同事必备）
    // ================================================================
    function num(id) {
        const node = $(id);
        if (!node) return 0;
        const raw = String(node.value || '')
            .replace(/\s/g, '')
            .replace(/,/g, '.');
        const n = parseFloat(raw);
        return Number.isFinite(n) ? n : 0;
    }

    // ================================================================
    //  海关杂费阶梯 (2026)
    // ================================================================
    const CUSTOMS_THRESHOLDS_RUB = [200000, 450000, 1200000, 2700000, 4200000, 5500000, 7000000];
    const CUSTOMS_FEES_RUB = [1231, 2462, 4924, 13541, 18465, 21344, 49240, 73860];
    function getCustomsFeeRub(valueRub) {
        let idx = CUSTOMS_THRESHOLDS_RUB.findIndex(th => valueRub <= th);
        if (idx === -1) idx = CUSTOMS_FEES_RUB.length - 1;
        return CUSTOMS_FEES_RUB[idx];
    }

    // ================================================================
    //  Toast
    // ================================================================
    let toastTimer = null;
    function showToast(msg) {
        let t = $('toast');
        if (!t) {
            t = document.createElement('div');
            t.id = 'toast';
            t.className = 'toast';
            document.body.appendChild(t);
        }
        t.textContent = msg;
        t.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => t.classList.remove('show'), 1500);
    }

    // ================================================================
    //  语言
    // ================================================================
    function applyLanguage(lang) {
        const t = LOCALES[lang];
        if (!t) return;
        document.documentElement.lang = t.langAttr || lang;
        el.pageTitle.textContent = t.title;
        el.lblExw.textContent = t.lblExw;
        el.lblRate.innerHTML = t.lblRate + ' <a href="https://cbr.ru/currency_base/daily/" target="_blank" title="' + t.rateLinkTitle + '">💰</a>';
        el.lblWeight.textContent = t.lblWeight;
        el.lblVolume.textContent = t.lblVolume;
        el.lblQty.textContent = t.lblQty;
        el.lblExpFee.textContent = t.lblExpFee;
        el.lblImpFee.textContent = t.lblImpFee;
        el.lblTariff.innerHTML = t.lblTariff + ' <a href="https://www.alta.ru/tnved/" target="_blank" title="' + t.codeLinkTitle + '">🐟</a>';
        el.lblCertFee.textContent = t.lblCertFee;
        el.lblVat.textContent = t.lblVat;
        el.resultLabel.textContent = t.resultLabel;
        el.noteText.textContent = t.note;
        el.dlFreight.textContent = t.dFreight;
        el.dlTariffAmt.textContent = t.dTariff;
        el.dlCustoms.textContent = t.dCustoms;
        el.dlService.textContent = t.dService;
        el.dlInsurance.textContent = t.dInsurance;
        el.dlCertFee.textContent = t.dCertFee;
        el.dlVatAmt.textContent = t.dVat;
        el.exw.placeholder = t.placeholderExw;
        el.rate.placeholder = t.placeholderRate;
        el.weight.placeholder = t.placeholderWeight;
        el.volume.placeholder = t.placeholderVolume;
        el.qty.placeholder = t.placeholderQty;
        el.expFee.placeholder = t.placeholderExpFee;
        el.impFee.placeholder = t.placeholderImpFee;
        el.tariff.placeholder = t.placeholderTariff;
        el.certFee.placeholder = t.placeholderCertFee;
        el.modeDelivery.textContent = t.modeDelivery;
        el.modeTrade.textContent = t.modeTrade;
        el.clearBtn.textContent = t.clearBtn;
        el.clearBtn.title = t.clearBtn;
        el.ddpDisplay.title = t.copyHint;
        if (el.focusHint) el.focusHint.textContent = t.focusHint;
        const nextLang = lang === 'zh' ? 'ru' : 'zh';
        el.langToggle.textContent = LOCALES[nextLang].langBtn;
        currentLang = lang;
        renderRateHint();   // 汇率提示跟随语言
        calc();
    }
    function toggleLanguage() {
        applyLanguage(currentLang === 'zh' ? 'ru' : 'zh');
    }

    // ================================================================
    //  清空
    // ================================================================
    function clearAll() {
        setFocusMode(false);   // 清空前先退出专注模式，避免"隐藏中"状态卡住
        ['exw', 'rate', 'weight', 'volume', 'qty', 'tariff', 'certFee'].forEach(id => {
            const f = $(id);
            if (f) f.value = '';
        });
        try { localStorage.removeItem('ddp_tariff'); } catch (e) {}
        rateUserEdited = false;      // 清空后允许再次自动填充
        rateStatus = { type: null, date: '' };
        renderRateHint();
        calc();
    }

    // ================================================================
    //  模式切换
    // ================================================================
    function setMode(mode) {
        currentMode = mode;
        el.modeDelivery.classList.toggle('active', mode === 'delivery');
        el.modeTrade.classList.toggle('active', mode === 'trade');
        const isDelivery = mode === 'delivery';
        el.fieldRate.classList.toggle('hidden', !isDelivery);
        el.fieldCertFee.classList.toggle('hidden', !isDelivery);
        el.fieldExpFee.classList.toggle('hidden', isDelivery);
        el.fieldQty.classList.toggle('hidden', isDelivery);
        el.detailRow.classList.toggle('hidden', !isDelivery);
        calc();
    }

    // ================================================================
    //  核心计算
    // ================================================================
    function calc() {
        const exw = num('exw');
        const w_raw = num('weight');
        const v_raw = num('volume');
        const qty = num('qty');
        const impFee = num('impFee');
        const tariffPct = num('tariff');

        // 增值税：空 → 22%，显式填 0 → 0%
        const vatRaw = String(el.vat.value || '').trim();
        const vatPct = vatRaw === '' ? 22 : num('vat');

        // 重货 / 抛货标识
        let density = 0;
        let isLight = true;
        let badgeHtml = '';
        const t = LOCALES[currentLang];
        if (w_raw > 0 && v_raw > 0) {
            density = w_raw / v_raw;
            isLight = density < 250;
            const badgeKey = isLight ? 'lightBadge' : 'heavyBadge';
            const badgeText = t[badgeKey].replace(/\{density\}/g, density.toFixed(1));
            badgeHtml = '<span class="type-badge ' + (isLight ? 'light' : 'heavy') + '">' + badgeText + '</span>';
        }
        el.badgeWrap.innerHTML = badgeHtml;

        let w_calc = w_raw;
        let v_calc = v_raw;

        // ---- 智能交付 ----
        if (currentMode === 'delivery') {
            const rate = num('rate');
            const certFee = num('certFee');
            if (!exw || !w_raw || !v_raw || !rate) {
                el.ddpDisplay.textContent = '—';
                el.ddpDisplay.className = 'ddp-price ddp-placeholder';
                ['dvFreight','dvTariff','dvCustoms','dvService','dvInsurance','dvCertFee','dvVat']
                    .forEach(id => { $(id).textContent = '—'; });
                return;
            }
            let intlFreight, domesticFreight;
            if (isLight) {
                intlFreight = 1610 * v_raw;
                domesticFreight = 300 * v_raw;
            } else {
                intlFreight = 8.4 * w_raw;
                domesticFreight = 2.5 * w_raw;
            }
            const tariffAmt = (exw + domesticFreight) * (tariffPct / 100);
            const goodsValueRub = exw * rate;
            const customsFeeRub = getCustomsFeeRub(goodsValueRub);
            const customsFeeCny = customsFeeRub / rate;
            const serviceFee = (exw + intlFreight + tariffAmt + customsFeeCny) * (impFee / 100);
            const insurance = exw * 0.003;
            const baseBeforeVat = exw + intlFreight + tariffAmt + customsFeeCny + serviceFee + insurance + certFee;
            const vatAmt = baseBeforeVat * (vatPct / 100);
            const ddp = baseBeforeVat + vatAmt;

            el.ddpDisplay.textContent = '¥ ' + ddp.toFixed(2);
            el.ddpDisplay.className = 'ddp-price';
            el.dvFreight.textContent = '¥ ' + intlFreight.toFixed(2);
            el.dvTariff.textContent = '¥ ' + tariffAmt.toFixed(2);
            el.dvCustoms.textContent = '¥ ' + customsFeeCny.toFixed(2);
            el.dvService.textContent = '¥ ' + serviceFee.toFixed(2);
            el.dvInsurance.textContent = '¥ ' + insurance.toFixed(2);
            el.dvCertFee.textContent = '¥ ' + certFee.toFixed(2);
            el.dvVat.textContent = '¥ ' + vatAmt.toFixed(2);
            return;
        }

        // ---- 智能贸易 ----
        if (currentMode === 'trade') {
            const expFee = num('expFee');
            if (!exw || !w_raw || !v_raw) {
                el.ddpDisplay.textContent = '—';
                el.ddpDisplay.className = 'ddp-price ddp-placeholder';
                return;
            }
            if (qty > 0) {
                if (isLight) {
                    v_calc = v_raw / qty;
                } else {
                    w_calc = w_raw / qty;
                }
            }
            let cnFee, ruFee;
            if (isLight) {
                cnFee = v_calc * 300;
                ruFee = v_calc * 1000;
            } else {
                cnFee = w_calc * 1.2;
                ruFee = w_calc * 7;
            }
            const base = exw * (1 + expFee / 100);
            const tariffCost = (base + cnFee) * tariffPct / 100;
            const ddp = (base + tariffCost + ruFee) * (1 + impFee / 100) * (1 + vatPct / 100);
            el.ddpDisplay.textContent = '¥ ' + ddp.toFixed(2);
            el.ddpDisplay.className = 'ddp-price';
            return;
        }
    }

    // ================================================================
    //  ⭐ 自动获取当日汇率（俄罗斯央行 ЦБ РФ）
    // ================================================================
    const RATE_CACHE_KEY = 'ddp_rate_cache';   // { date:'2026-09-15', value:11.5384 }

    // 当日日期键（本地时区）
    function todayKey() {
        const d = new Date();
        const p = n => String(n).padStart(2, '0');
        return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
    }

    // --- 解析 CBR 官方 XML（Value/Nominal = 1¥ 兑多少 ₽）---
    function parseCbrXml(text) {
        const doc = new DOMParser().parseFromString(text, 'text/xml');
        if (doc.getElementsByTagName('parsererror').length) return null;
        const list = doc.getElementsByTagName('Valute');
        for (let i = 0; i < list.length; i++) {
            const node = list[i];
            const codeNode = node.getElementsByTagName('CharCode')[0];
            if (!codeNode || codeNode.textContent.trim() !== 'CNY') continue;
            const nomNode = node.getElementsByTagName('Nominal')[0];
            const valNode = node.getElementsByTagName('Value')[0];
            if (!valNode) return null;
            const nominal = parseFloat((nomNode ? nomNode.textContent : '1').replace(',', '.')) || 1;
            const value = parseFloat(valNode.textContent.replace(',', '.'));
            if (!Number.isFinite(value)) return null;
            return value / nominal;
        }
        return null;
    }

    // --- 多数据源，逐个尝试 ---
    const RATE_SOURCES = [
        {
            // 1) 官方 cbr.ru（需经公共 CORS 代理）
            url: 'https://api.allorigins.win/raw?url=' +
                 encodeURIComponent('https://www.cbr.ru/scripts/XML_daily.asp'),
            parse: res => res.text().then(parseCbrXml)
        },
        {
            // 2) CBR 镜像，原生带 CORS 头，最稳
            url: 'https://www.cbr-xml-daily.ru/daily_json.js',
            parse: async res => {
                const d = await res.json();
                const c = d && d.Valute && d.Valute.CNY;
                return c ? c.Value / (c.Nominal || 1) : null;
            }
        },
        {
            // 3) 兜底：第三方汇率 API
            url: 'https://open.er-api.com/v6/latest/CNY',
            parse: async res => {
                const d = await res.json();
                return (d && d.rates) ? d.rates.RUB : null;
            }
        }
    ];

    async function fetchLiveRate() {
        for (const src of RATE_SOURCES) {
            const ctrl = new AbortController();
            const timer = setTimeout(() => ctrl.abort(), 8000);
            try {
                const res = await fetch(src.url, { signal: ctrl.signal, cache: 'no-store' });
                if (!res.ok) throw new Error('HTTP ' + res.status);
                const v = await src.parse(res);
                if (Number.isFinite(v) && v > 0) {
                    return Math.round(v * 10000) / 10000;
                }
            } catch (e) {
                /* 静默失败，换下一个数据源 */
            } finally {
                clearTimeout(timer);
            }
        }
        return null;
    }

    // --- 缓存（同一天内不重复请求）---
    function readRateCache() {
        try {
            const c = JSON.parse(localStorage.getItem(RATE_CACHE_KEY) || 'null');
            if (c && c.date === todayKey() && Number.isFinite(c.value) && c.value > 0) return c.value;
        } catch (e) {}
        return null;
    }
    function writeRateCache(value) {
        try {
            localStorage.setItem(RATE_CACHE_KEY, JSON.stringify({ date: todayKey(), value }));
        } catch (e) {}
    }

    // --- 状态提示 ---
    let rateStatus = { type: null, date: '' };   // null | loading | ok | cached | fail
    let rateUserEdited = false;                  // 用户手动改过就不再自动覆盖
    let rateLoading = false;

    function renderRateHint() {
        const t = LOCALES[currentLang];
        const node = el.rateHint;
        if (!node) return;
        let txt = '', cls = '';
        switch (rateStatus.type) {
            case 'loading': txt = t.rateLoading; break;
            case 'ok':      txt = t.rateOk.replace('{date}', rateStatus.date); cls = 'ok'; break;
            case 'cached':  txt = t.rateCached.replace('{date}', rateStatus.date); cls = 'ok'; break;
            case 'fail':    txt = t.rateFail; cls = 'err'; break;
            default:        txt = '';
        }
        node.textContent = txt;
        node.className = 'rate-hint' + (cls ? ' ' + cls : '');
    }

    function applyRate(value, force) {
        if (rateUserEdited && !force) return;
        el.rate.value = String(value);
        rateUserEdited = false;
        calc();
    }

    async function refreshRate(force) {
        if (rateLoading) return;
        // 1) 缓存优先
        if (!force) {
            const cached = readRateCache();
            if (cached) {
                applyRate(cached, true);
                rateStatus = { type: 'cached', date: todayKey() };
                renderRateHint();
                return cached;
            }
        }
        // 2) 联网获取
        rateLoading = true;
        rateStatus = { type: 'loading', date: '' };
        renderRateHint();
        const v = await fetchLiveRate();
        rateLoading = false;

        if (v) {
            writeRateCache(v);
            applyRate(v, force);
            rateStatus = { type: 'ok', date: todayKey() };
            renderRateHint();
            return v;
        }
        rateStatus = { type: 'fail', date: '' };
        renderRateHint();
        return null;
    }

    // ================================================================
    //  ⭐ 专注模式：点击 DDP 价格 → 隐藏全部，只显示完税后交货价
    // ================================================================
    const FOCUS_CLASS = 'focus-mode';

    function isFocusMode() {
        return document.body.classList.contains(FOCUS_CLASS);
    }

    function setFocusMode(on) {
        if (on) {
            // 没有有效价格（还是占位符"—"）时不进入，避免满屏只有一个横杠
            if (el.ddpDisplay.classList.contains('ddp-placeholder')) return;
            // 收起软键盘（iOS 数字键盘没有"完成"键）
            if (document.activeElement && document.activeElement.blur) {
                document.activeElement.blur();
            }
        }
        document.body.classList.toggle(FOCUS_CLASS, on);
    }

    function toggleFocusMode() {
        setFocusMode(!isFocusMode());
    }

    // ================================================================
    //  持久化（费率类字段，打开即用）
    // ================================================================
    const PERSIST = ['expFee', 'impFee', 'tariff', 'vat'];

    // ================================================================
    //  事件
    // ================================================================
    const inputIds = ['exw', 'rate', 'weight', 'volume', 'qty', 'expFee', 'impFee', 'tariff', 'certFee', 'vat'];
    inputIds.forEach(id => {
        const node = $(id);
        if (!node) return;
        node.addEventListener('input', () => {
            if (PERSIST.indexOf(id) !== -1) {
                try { localStorage.setItem('ddp_' + id, node.value); } catch (e) {}
            }
            calc();
        });
    });

    // 用户手动改汇率 → 之后不再自动覆盖
    el.rate.addEventListener('input', () => { rateUserEdited = true; });

    // 点击汇率提示 = 强制刷新
    el.rateHint.addEventListener('click', () => refreshRate(true));

    el.langToggle.addEventListener('click', toggleLanguage);
    el.clearBtn.addEventListener('click', clearAll);
    el.modeDelivery.addEventListener('click', () => setMode('delivery'));
    el.modeTrade.addEventListener('click', () => setMode('trade'));

    // ⭐ 点击 DDP 价格 = 进入 / 退出专注模式（不再复制）
    el.ddpDisplay.addEventListener('click', e => {
        e.stopPropagation();          // 防止冒泡到 document 又立刻退出
        toggleFocusMode();
    });

    // 专注模式下：点击页面任意位置退出
    document.addEventListener('click', () => {
        if (isFocusMode()) setFocusMode(false);
    });

    // Esc 键退出（桌面端）
    document.addEventListener('keydown', e => {
        if (e.key === 'Escape' && isFocusMode()) setFocusMode(false);
    });

    // 点结果区域收起键盘（iOS 数字键盘没有"完成"键）
    document.querySelector('.result').addEventListener('click', () => {
        if (document.activeElement && document.activeElement.blur) {
            document.activeElement.blur();
        }
    });

    // ================================================================
    //  启动
    // ================================================================
    PERSIST.forEach(id => {
        const node = $(id);
        if (!node) return;
        try {
            const v = localStorage.getItem('ddp_' + id);
            if (v !== null) node.value = v;
        } catch (e) {}
    });

    applyLanguage('zh');
    setMode('trade');
    refreshRate(false);   // ⭐ 打开页面自动填当日汇率
</script>
</body>
</html>
